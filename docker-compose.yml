# 로컬 테스트 / 단일 서버(EC2) 운영용. 시크릿은 같은 폴더의 .env에서 읽는다.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: cogi
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    image: ${BACKEND_IMAGE:-cogi-backend}
    build: ./backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/cogi?characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE:-cogi-frontend}
    build: ./frontend
    environment:
      BACKEND_HOST: backend:8080
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  db-data:
